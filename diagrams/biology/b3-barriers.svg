<text x="326" y="175" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#0f0e0c" text-anchor="middle">1</text><circle cx="388" cy="306" r="20" fill="#e8a040" opacity="0.35" filter="url(#blur)"></circle><circle cx="388" cy="306" r="17" fill="url(#gAm)"></circle>
<text x="388" y="313" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#0f0e0c" text-anchor="middle">2</text><circle cx="300" cy="214" r="20" fill="#e8a040" opacity="0.35" filter="url(#blur)"></circle><circle cx="300" cy="214" r="17" fill="url(#gAm)"></circle>
<text x="300" y="221" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#0f0e0c" text-anchor="middle">3</text><circle cx="266" cy="332" r="20" fill="#4ecfaa" opacity="0.35" filter="url(#blur)"></circle><circle cx="266" cy="332" r="17" fill="url(#gTeal)"></circle>
<text x="266" y="339" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#0f0e0c" text-anchor="middle">4</text><g filter="url(#soft)"><rect x="28" y="430" width="272" height="150" rx="16" fill="url(#gSur)" stroke="#e8a040" stroke-opacity="0.35"></rect></g>
<text x="48" y="468" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="600" fill="#e8a040">1 · Nose</text><text x="48" y="502" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="rgba(245,240,232,0.6)">Hairs and mucus trap</text><text x="48" y="528" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="rgba(245,240,232,0.6)">pathogens in the air</text><text x="48" y="554" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="rgba(245,240,232,0.6)">you breathe in.</text><g filter="url(#soft)"><rect x="300" y="430" width="272" height="150" rx="16" fill="url(#gSur)" stroke="#e8a040" stroke-opacity="0.35"></rect></g>
<text x="320" y="468" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="600" fill="#e8a040">2 · Skin</text><text x="320" y="502" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="rgba(245,240,232,0.6)">A tough barrier that</text><text x="320" y="528" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="rgba(245,240,232,0.6)">keeps pathogens out</text><text x="320" y="554" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="rgba(245,240,232,0.6)">of your body.</text><g filter="url(#soft)"><rect x="28" y="592" width="272" height="150" rx="16" fill="url(#gSur)" stroke="#e8a040" stroke-opacity="0.35"></rect></g>
<text x="48" y="630" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="600" fill="#e8a040">3 · Airways</text><text x="48" y="664" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="rgba(245,240,232,0.6)">Cilia in the trachea</text><text x="48" y="690" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="rgba(245,240,232,0.6)">and bronchi sweep</text><text x="48" y="716" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="rgba(245,240,232,0.6)">mucus upwards.</text><g filter="url(#soft)"><rect x="300" y="592" width="272" height="150" rx="16" fill="url(#gSur)" stroke="#4ecfaa" stroke-opacity="0.35"></rect></g>
<text x="320" y="630" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="600" fill="#4ecfaa">4 · Stomach acid</text><text x="320" y="664" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="rgba(245,240,232,0.6)">Kills pathogens you</text><text x="320" y="690" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="rgba(245,240,232,0.6)">swallow in food,</text><text x="320" y="716" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="rgba(245,240,232,0.6)">drink and mucus.</text><g filter="url(#soft)"><rect x="28" y="770" width="544" height="176" rx="18" fill="url(#gSur)" stroke="#e8a040" stroke-opacity="0.28"></rect></g>
<text x="52" y="804" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#e8a040">Inside the airway</text>
<text x="52" y="832" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="rgba(245,240,232,0.6)">Cilia beat, pushing the mucus up to your</text>
<text x="52" y="856" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="rgba(245,240,232,0.6)">throat, where it is swallowed.</text>
