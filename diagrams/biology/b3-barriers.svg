  <radialGradient id="gRd" cx="40%" cy="32%" r="78%">
    <stop offset="0%" stop-color="#ff9b9b"></stop><stop offset="55%" stop-color="#e05252"></stop><stop offset="100%" stop-color="#7d1f1f"></stop></radialGradient>
  <radialGradient id="gCell" cx="38%" cy="28%" r="82%">
    <stop offset="0%" stop-color="rgba(245,240,232,0.30)"></stop>
    <stop offset="55%" stop-color="rgba(120,200,180,0.16)"></stop>
    <stop offset="100%" stop-color="rgba(10,30,26,0.55)"></stop></radialGradient>
  <linearGradient id="gSur" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#26221c"></stop><stop offset="100%" stop-color="#17140f"></stop></linearGradient>
  <linearGradient id="gBody" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#4a4339"></stop><stop offset="60%" stop-color="#332e27"></stop><stop offset="100%" stop-color="#26221c"></stop></linearGradient></defs><rect width="600" height="972" fill="#0f0e0c"></rect><text x="32" y="48" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#f5f0e8">Barriers: keeping pathogens out</text>
<text x="32" y="80" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="rgba(245,240,232,0.6)">Physical barriers in amber, chemical in teal.</text><g filter="url(#soft)">
