<path d="M352,248 C370,260 376,294 378,340" fill="none" stroke="#332e27" stroke-width="24" stroke-linecap="round"></path>
<rect x="288" y="198" width="24" height="28" rx="8" fill="url(#gBody)" stroke="rgba(245,240,232,0.42)" stroke-width="2"></rect>
