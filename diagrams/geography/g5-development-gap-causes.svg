<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" width="100%" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#e8a040"/>
  </marker>
  <radialGradient id="gCore" cx="50%" cy="38%" r="72%">
    <stop offset="0%" stop-color="#ff9b9b"/><stop offset="60%" stop-color="#e05252"/><stop offset="100%" stop-color="#7d1f1f"/>
  </radialGradient>
</defs>
<rect width="620" height="420" fill="#0f0e0c"/>
<text x="28" y="42" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#f5f0e8">Why the development gap exists</text>
<text x="28" y="68" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="rgba(245,240,232,0.6)">Four causes, one outcome.</text>

<g font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <rect x="28" y="96" width="256" height="72" rx="12" fill="rgba(245,240,232,0.06)" stroke="#e8a040" stroke-opacity="0.45"/>
  <text x="44" y="124" font-size="19" font-weight="700" fill="#e8a040">Historical</text>
  <text x="44" y="150" font-size="16" fill="rgba(245,240,232,0.85)">Colonialism took wealth out</text>

  <rect x="336" y="96" width="256" height="72" rx="12" fill="rgba(245,240,232,0.06)" stroke="#e8a040" stroke-opacity="0.45"/>
  <text x="352" y="124" font-size="19" font-weight="700" fill="#e8a040">Trade</text>
  <text x="352" y="150" font-size="16" fill="rgba(245,240,232,0.85)">Cheap exports, dear imports</text>

  <rect x="28" y="268" width="256" height="72" rx="12" fill="rgba(245,240,232,0.06)" stroke="#4ecfaa" stroke-opacity="0.45"/>
  <text x="44" y="296" font-size="19" font-weight="700" fill="#4ecfaa">Debt</text>
  <text x="44" y="322" font-size="16" fill="rgba(245,240,232,0.85)">Repayments crowd out schools</text>

  <rect x="336" y="268" width="256" height="72" rx="12" fill="rgba(245,240,232,0.06)" stroke="#4ecfaa" stroke-opacity="0.45"/>
  <text x="352" y="296" font-size="19" font-weight="700" fill="#4ecfaa">Physical</text>
  <text x="352" y="322" font-size="16" fill="rgba(245,240,232,0.85)">Landlocked, drought, disease</text>
</g>

<ellipse cx="310" cy="218" rx="98" ry="42" fill="url(#gCore)"/>
<text x="310" y="214" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#0f0e0c" text-anchor="middle">DEVELOPMENT</text>
<text x="310" y="238" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#0f0e0c" text-anchor="middle">GAP</text>

<g fill="none" stroke="#e8a040" stroke-width="2.5" marker-end="url(#ar)" stroke-opacity="0.8">
  <path d="M172 172 L232 190"/>
  <path d="M448 172 L388 190"/>
  <path d="M172 264 L232 246"/>
  <path d="M448 264 L388 246"/>
</g>

<text x="28" y="374" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="rgba(245,240,232,0.7)">They reinforce each other: debt forces more raw-material exports,</text>
<text x="28" y="396" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="rgba(245,240,232,0.7)">which keeps trade earnings low.</text>
</svg>
