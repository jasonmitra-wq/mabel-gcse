<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" width="100%" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="gNg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="rgba(232,160,64,0.30)"/>
    <stop offset="100%" stop-color="rgba(78,207,170,0.30)"/>
  </linearGradient>
</defs>
<rect width="620" height="420" fill="#0f0e0c"/>
<text x="28" y="42" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#f5f0e8">Nigeria — one country, two halves</text>
<text x="28" y="68" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="rgba(245,240,232,0.6)">West Africa, on the Gulf of Guinea.</text>

<path d="M76 116 L250 104 L276 134 L266 192 L246 236 L200 276 L150 270 L110 236 L80 180 Z"
      fill="url(#gNg)" stroke="#f5f0e8" stroke-opacity="0.55" stroke-width="2"/>
<path d="M82 182 L266 172" stroke="#f5f0e8" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="7 6"/>
<text x="124" y="150" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#e8a040">NORTH</text>
<text x="124" y="224" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#4ecfaa">SOUTH</text>
<path d="M200 276 L246 236 L234 268 L210 288 Z" fill="rgba(224,82,82,0.45)" stroke="#e05252" stroke-width="1.5"/>
<circle cx="158" cy="258" r="5" fill="#f5f0e8"/>
<text x="158" y="292" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="rgba(245,240,232,0.85)" text-anchor="middle">Lagos</text>
<text x="230" y="308" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#e05252" text-anchor="middle">Niger Delta</text>

<g font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <rect x="308" y="96" width="284" height="116" rx="12" fill="rgba(232,160,64,0.10)" stroke="rgba(232,160,64,0.40)"/>
  <text x="326" y="124" font-size="18" font-weight="700" fill="#e8a040">North</text>
  <text x="326" y="152" font-size="16" fill="rgba(245,240,232,0.85)">Drier, mainly farming</text>
  <text x="326" y="176" font-size="16" fill="rgba(245,240,232,0.85)">Fewer girls finish school</text>
  <text x="326" y="200" font-size="16" fill="rgba(245,240,232,0.85)">Conflict has displaced millions</text>

  <rect x="308" y="228" width="284" height="116" rx="12" fill="rgba(78,207,170,0.10)" stroke="rgba(78,207,170,0.40)"/>
  <text x="326" y="256" font-size="18" font-weight="700" fill="#4ecfaa">South</text>
  <text x="326" y="284" font-size="16" fill="rgba(245,240,232,0.85)">Oil, ports and big cities</text>
  <text x="326" y="308" font-size="16" fill="rgba(245,240,232,0.85)">Film and service industries</text>
  <text x="326" y="332" font-size="16" fill="rgba(245,240,232,0.85)">Higher incomes, worse pollution</text>
</g>

<text x="28" y="378" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="rgba(245,240,232,0.7)">Borders drawn under British rule cut across more than</text>
<text x="28" y="400" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="rgba(245,240,232,0.7)">250 ethnic groups.</text>
</svg>
