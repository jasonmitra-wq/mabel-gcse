<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" width="100%" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="620" height="420" fill="#0f0e0c"/>
<text x="28" y="42" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#f5f0e8">Oil in the Niger Delta</text>
<text x="28" y="68" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="rgba(245,240,232,0.6)">What the oil companies bring, and what they take.</text>

<g font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <rect x="28" y="92" width="272" height="262" rx="14" fill="rgba(78,207,170,0.08)" stroke="rgba(78,207,170,0.45)"/>
  <text x="46" y="124" font-size="19" font-weight="700" fill="#4ecfaa">What it brings</text>
  <text x="46" y="162" font-size="16" fill="rgba(245,240,232,0.88)">Tax and royalties for</text>
  <text x="46" y="184" font-size="16" fill="rgba(245,240,232,0.88)">government spending</text>
  <text x="46" y="220" font-size="16" fill="rgba(245,240,232,0.88)">Direct jobs and trained</text>
  <text x="46" y="242" font-size="16" fill="rgba(245,240,232,0.88)">engineers</text>
  <text x="46" y="278" font-size="16" fill="rgba(245,240,232,0.88)">Roads and clinics near</text>
  <text x="46" y="300" font-size="16" fill="rgba(245,240,232,0.88)">the oil facilities</text>
  <text x="46" y="336" font-size="16" fill="rgba(245,240,232,0.88)">Technology transfer</text>

  <rect x="320" y="92" width="272" height="262" rx="14" fill="rgba(224,82,82,0.08)" stroke="rgba(224,82,82,0.45)"/>
  <text x="338" y="124" font-size="19" font-weight="700" fill="#e05252">What it costs</text>
  <text x="338" y="162" font-size="16" fill="rgba(245,240,232,0.88)">Few jobs for the money</text>
  <text x="338" y="184" font-size="16" fill="rgba(245,240,232,0.88)">invested — oil runs on</text>
  <text x="338" y="206" font-size="16" fill="rgba(245,240,232,0.88)">machines, not people</text>
  <text x="338" y="242" font-size="16" fill="rgba(245,240,232,0.88)">Spills poison farmland</text>
  <text x="338" y="264" font-size="16" fill="rgba(245,240,232,0.88)">and fishing grounds</text>
  <text x="338" y="300" font-size="16" fill="rgba(245,240,232,0.88)">Gas flaring pollutes</text>
  <text x="338" y="336" font-size="16" fill="rgba(245,240,232,0.88)">Most profits leave</text>
</g>

<text x="28" y="386" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="rgba(245,240,232,0.7)">The argument is not "oil is good" or "oil is bad" —</text>
<text x="28" y="408" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="rgba(245,240,232,0.7)">it is about who keeps the benefit.</text>
</svg>
