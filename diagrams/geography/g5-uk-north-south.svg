<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" width="100%" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="gUK" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="rgba(224,82,82,0.30)"/>
    <stop offset="55%" stop-color="rgba(232,160,64,0.24)"/>
    <stop offset="100%" stop-color="rgba(78,207,170,0.30)"/>
  </linearGradient>
</defs>
<rect width="620" height="420" fill="#0f0e0c"/>
<text x="28" y="42" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#f5f0e8">The north–south divide</text>
<text x="28" y="68" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="rgba(245,240,232,0.6)">A broad pattern across England, not a line on the ground.</text>

<path d="M116 96 L150 102 L142 132 L160 154 L146 180 L164 206 L152 238 L170 266 L150 300 L118 320 L96 294 L108 262 L90 232 L106 200 L92 170 L110 140 Z"
      fill="url(#gUK)" stroke="rgba(245,240,232,0.45)" stroke-width="2"/>
<path d="M88 196 L172 188" stroke="#f5f0e8" stroke-opacity="0.40" stroke-width="2" stroke-dasharray="7 6"/>
<text x="82" y="146" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#e05252" text-anchor="end">North</text>
<text x="82" y="262" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#4ecfaa" text-anchor="end">South</text>

<g font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <text x="222" y="118" font-size="16" font-weight="700" fill="rgba(245,240,232,0.55)">In the north, compared with the south</text>

  <text x="222" y="162" font-size="17" fill="rgba(245,240,232,0.88)">House prices</text>
  <text x="592" y="162" font-size="17" font-weight="700" fill="#4ecfaa" text-anchor="end">lower</text>
  <line x1="222" y1="176" x2="592" y2="176" stroke="rgba(245,240,232,0.14)"/>

  <text x="222" y="208" font-size="17" fill="rgba(245,240,232,0.88)">Average income</text>
  <text x="592" y="208" font-size="17" font-weight="700" fill="#e05252" text-anchor="end">lower</text>
  <line x1="222" y1="222" x2="592" y2="222" stroke="rgba(245,240,232,0.14)"/>

  <text x="222" y="254" font-size="17" fill="rgba(245,240,232,0.88)">Life expectancy</text>
  <text x="592" y="254" font-size="17" font-weight="700" fill="#e05252" text-anchor="end">lower</text>
  <line x1="222" y1="268" x2="592" y2="268" stroke="rgba(245,240,232,0.14)"/>

  <text x="222" y="300" font-size="17" fill="rgba(245,240,232,0.88)">Graduates staying</text>
  <text x="592" y="300" font-size="17" font-weight="700" fill="#e05252" text-anchor="end">fewer</text>
</g>

<text x="28" y="368" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="rgba(245,240,232,0.7)">There is deprivation in the south and prosperity in the north.</text>
<text x="28" y="390" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="rgba(245,240,232,0.7)">Cheaper housing is the north's one advantage here.</text>
</svg>
