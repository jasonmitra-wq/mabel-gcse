<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" width="100%" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="620" height="420" fill="#0f0e0c"/>
<text x="28" y="42" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#f5f0e8">How the UK economy changed shape</text>
<text x="28" y="68" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="rgba(245,240,232,0.6)">From making things to providing services. Proportions illustrative.</text>

<g font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16">
  <text x="80" y="116" fill="rgba(245,240,232,0.75)" text-anchor="middle">1900</text>
  <rect x="42" y="130" width="76" height="62" fill="#e8a040" rx="4"/>
  <rect x="42" y="192" width="76" height="100" fill="#e05252" rx="4"/>
  <rect x="42" y="292" width="76" height="50" fill="#4ecfaa" rx="4"/>

  <text x="208" y="116" fill="rgba(245,240,232,0.75)" text-anchor="middle">1960</text>
  <rect x="170" y="130" width="76" height="22" fill="#e8a040" rx="4"/>
  <rect x="170" y="152" width="76" height="92" fill="#e05252" rx="4"/>
  <rect x="170" y="244" width="76" height="98" fill="#4ecfaa" rx="4"/>

  <text x="336" y="116" fill="rgba(245,240,232,0.75)" text-anchor="middle">Today</text>
  <rect x="298" y="130" width="76" height="8" fill="#e8a040" rx="3"/>
  <rect x="298" y="138" width="76" height="28" fill="#e05252" rx="4"/>
  <rect x="298" y="166" width="76" height="140" fill="#4ecfaa" rx="4"/>
  <rect x="298" y="306" width="76" height="36" fill="#f5f0e8" rx="4"/>
</g>

<g font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <rect x="420" y="136" width="14" height="14" fill="#e8a040" rx="3"/>
  <text x="444" y="149" font-size="16" fill="rgba(245,240,232,0.88)">Primary</text>
  <text x="444" y="169" font-size="14" fill="rgba(245,240,232,0.55)">farming, mining</text>

  <rect x="420" y="190" width="14" height="14" fill="#e05252" rx="3"/>
  <text x="444" y="203" font-size="16" fill="rgba(245,240,232,0.88)">Secondary</text>
  <text x="444" y="223" font-size="14" fill="rgba(245,240,232,0.55)">manufacturing</text>

  <rect x="420" y="244" width="14" height="14" fill="#4ecfaa" rx="3"/>
  <text x="444" y="257" font-size="16" fill="rgba(245,240,232,0.88)">Tertiary</text>
  <text x="444" y="277" font-size="14" fill="rgba(245,240,232,0.55)">services</text>

  <rect x="420" y="298" width="14" height="14" fill="#f5f0e8" rx="3"/>
  <text x="444" y="311" font-size="16" fill="rgba(245,240,232,0.88)">Quaternary</text>
  <text x="444" y="331" font-size="14" fill="rgba(245,240,232,0.55)">research, IT, media</text>
</g>

<text x="28" y="382" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="rgba(245,240,232,0.7)">The quaternary sector grew out of services and is counted</text>
<text x="28" y="404" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="rgba(245,240,232,0.7)">separately only recently.</text>
</svg>
