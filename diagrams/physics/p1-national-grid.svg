<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" width="100%" role="img" aria-label="The National Grid: power station at about 25 kV, step-up transformer to 400 kV, transmission cables, step-down transformer, homes at 230 V">
<defs><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="rgba(245,240,232,0.85)"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8a040"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4ecfaa"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8705a"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="rgba(245,240,232,0.68)"/></marker></defs>
<rect x="0" y="0" width="480" height="560" fill="#0f0e0c" stroke="none" stroke-width="3"/>
<text x="20" y="36" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#f5f0e8">The National Grid</text>
<rect x="110" y="56" width="260" height="66" rx="10" fill="rgba(245,240,232,0.05)" stroke="#e8a040" stroke-width="2.5"/>
<text x="240" y="84" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" text-anchor="middle" fill="#f5f0e8">power station</text>
<text x="240" y="108" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="middle" fill="#4ecfaa">about 25 kV</text>
<line x1="240" y1="124" x2="240" y2="158" stroke="rgba(245,240,232,0.85)" stroke-width="3" marker-end="url(#aw)" stroke-linecap="round"/>
<rect x="110" y="160" width="260" height="66" rx="10" fill="rgba(245,240,232,0.05)" stroke="#e8a040" stroke-width="2.5"/>
<text x="240" y="188" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" text-anchor="middle" fill="#f5f0e8">step-up transformer</text>
<text x="240" y="212" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="middle" fill="#4ecfaa">up to 400 kV</text>
<line x1="240" y1="228" x2="240" y2="262" stroke="rgba(245,240,232,0.85)" stroke-width="3" marker-end="url(#aw)" stroke-linecap="round"/>
<rect x="110" y="264" width="260" height="66" rx="10" fill="rgba(245,240,232,0.05)" stroke="#e8a040" stroke-width="2.5"/>
<text x="240" y="292" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" text-anchor="middle" fill="#f5f0e8">transmission cables</text>
<text x="240" y="316" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="middle" fill="#4ecfaa">high p.d., low current</text>
<line x1="240" y1="332" x2="240" y2="366" stroke="rgba(245,240,232,0.85)" stroke-width="3" marker-end="url(#aw)" stroke-linecap="round"/>
<rect x="110" y="368" width="260" height="66" rx="10" fill="rgba(245,240,232,0.05)" stroke="#e8a040" stroke-width="2.5"/>
<text x="240" y="396" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" text-anchor="middle" fill="#f5f0e8">step-down transformer</text>
<text x="240" y="420" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="middle" fill="#4ecfaa">p.d. made lower</text>
<line x1="240" y1="436" x2="240" y2="470" stroke="rgba(245,240,232,0.85)" stroke-width="3" marker-end="url(#aw)" stroke-linecap="round"/>
<rect x="110" y="472" width="260" height="66" rx="10" fill="rgba(245,240,232,0.05)" stroke="#e8a040" stroke-width="2.5"/>
<text x="240" y="500" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" text-anchor="middle" fill="#f5f0e8">homes</text>
<text x="240" y="524" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="middle" fill="#4ecfaa">230 V</text>
</svg>
