<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" width="100%" role="img" aria-label="Sankey diagram for a lamp: 100 J in electrically, 15 J out usefully by light, 85 J wasted by heating the surroundings">
<defs><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="rgba(245,240,232,0.85)"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8a040"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4ecfaa"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8705a"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="rgba(245,240,232,0.68)"/></marker></defs>
<rect x="0" y="0" width="480" height="440" fill="#0f0e0c" stroke="none" stroke-width="3"/>
<text x="20" y="36" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#f5f0e8">Sankey diagram: a lamp</text>
<path d="M40 90 H400 V78 L440 105 L400 132 V120 H370 V350 H384 L285 400 L186 350 H200 V290 H40 Z" fill="rgba(232,160,64,0.18)" stroke="#e8a040" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="200" y1="120" x2="370" y2="120" stroke="#e8a040" stroke-width="1.5" stroke-dasharray="6 6" stroke-linecap="round"/>
<text x="50" y="192" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#f5f0e8">100 J in</text>
<text x="50" y="216" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="rgba(245,240,232,0.68)">electrically</text>
<text x="440" y="70" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" text-anchor="end" fill="#4ecfaa">15 J useful, by light</text>
<text x="175" y="330" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="19" text-anchor="end" fill="#e8705a">85 J wasted</text>
<text x="175" y="354" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="end" fill="rgba(245,240,232,0.68)">by heating the</text>
<text x="175" y="376" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="end" fill="rgba(245,240,232,0.68)">surroundings</text>
<text x="20" y="420" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="rgba(245,240,232,0.68)">15 J + 85 J = 100 J. Arrow width shows the energy.</text>
</svg>
