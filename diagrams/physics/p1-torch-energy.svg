<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 470" width="100%" role="img" aria-label="A torch: energy is transferred electrically from the chemical store of the battery to the lamp, then by light and by heating to the thermal store of the surroundings">
<defs><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="rgba(245,240,232,0.85)"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8a040"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4ecfaa"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8705a"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="rgba(245,240,232,0.68)"/></marker></defs>
<rect x="0" y="0" width="480" height="470" fill="#0f0e0c" stroke="none" stroke-width="3"/>
<text x="20" y="36" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#f5f0e8">A torch: stores and transfers</text>
<rect x="100" y="60" width="280" height="64" rx="10" fill="rgba(245,240,232,0.05)" stroke="#e8a040" stroke-width="2.5"/>
<text x="240" y="88" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="19" text-anchor="middle" fill="#f5f0e8">chemical energy store</text>
<text x="240" y="112" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="middle" fill="rgba(245,240,232,0.68)">of the battery</text>
<line x1="240" y1="126" x2="240" y2="190" stroke="#e8a040" stroke-width="3" marker-end="url(#aa)" stroke-linecap="round"/>
<text x="254" y="164" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#e8a040">electrically</text>
<rect x="160" y="194" width="160" height="52" rx="10" fill="rgba(245,240,232,0.05)" stroke="#f5f0e8" stroke-width="2.5"/>
<text x="240" y="227" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="19" text-anchor="middle" fill="#f5f0e8">the lamp</text>

<line x1="210" y1="248" x2="150" y2="350" stroke="#4ecfaa" stroke-width="3" marker-end="url(#at)" stroke-linecap="round"/>
<line x1="270" y1="248" x2="330" y2="350" stroke="#e8705a" stroke-width="3" marker-end="url(#ar)" stroke-linecap="round"/>
<text x="20" y="296" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#4ecfaa">by radiation</text>
<text x="20" y="318" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#4ecfaa">(light): useful</text>
<text x="460" y="296" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" text-anchor="end" fill="#e8705a">by heating:</text>
<text x="460" y="318" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="end" fill="#e8705a">wasted</text>
<rect x="60" y="354" width="360" height="64" rx="10" fill="rgba(245,240,232,0.05)" stroke="rgba(245,240,232,0.68)" stroke-width="2.5"/>
<text x="240" y="382" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="19" text-anchor="middle" fill="#f5f0e8">thermal energy store</text>
<text x="240" y="406" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="middle" fill="rgba(245,240,232,0.68)">of the surroundings</text>
<text x="240" y="452" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="middle" fill="rgba(245,240,232,0.68)">The light is absorbed and warms the room too.</text>
</svg>
