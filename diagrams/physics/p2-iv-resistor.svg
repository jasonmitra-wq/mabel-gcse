<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 405" width="100%" role="img" aria-label="I-V graph for a resistor at constant temperature: a straight line through the origin">
<defs><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="rgba(245,240,232,0.85)"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8a040"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4ecfaa"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8705a"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="rgba(245,240,232,0.68)"/></marker></defs>
<rect x="0" y="0" width="480" height="405" fill="#0f0e0c" stroke="none" stroke-width="3"/>
<text x="20" y="43" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#f5f0e8">Resistor at constant temperature</text>
<line x1="50" y1="190" x2="440" y2="190" stroke="rgba(245,240,232,0.68)" stroke-width="2" marker-end="url(#am)" stroke-linecap="round"/>
<line x1="240" y1="315" x2="240" y2="55" stroke="rgba(245,240,232,0.68)" stroke-width="2" marker-end="url(#am)" stroke-linecap="round"/>
<text x="228" y="73" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" text-anchor="end" fill="rgba(245,240,232,0.68)">current (A)</text>
<text x="440" y="218" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" text-anchor="end" fill="rgba(245,240,232,0.68)">potential difference (V)</text>
<text x="232" y="182" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="end" fill="rgba(245,240,232,0.68)">0</text>
