<text x="20" y="349" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#f5f0e8">Straight line through the origin:</text>
<text x="20" y="371" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#f5f0e8">the resistance stays the same.</text>
