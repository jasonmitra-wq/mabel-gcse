<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" width="100%" role="img" aria-label="Parallel circuit: two resistors on separate branches; each has the full supply potential difference; the current splits and joins again">
<defs><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="rgba(245,240,232,0.85)"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8a040"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4ecfaa"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8705a"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="rgba(245,240,232,0.68)"/></marker></defs>
<rect x="0" y="0" width="480" height="440" fill="#0f0e0c" stroke="none" stroke-width="3"/>
<text x="20" y="36" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#f5f0e8">Parallel: separate branches</text>
<path d="M90 90 H390 V290 H90 Z M90 190 H390" fill="none" stroke="rgba(245,240,232,0.85)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="231" y="86" width="18" height="8" fill="#0f0e0c" stroke="none" stroke-width="3"/><line x1="232" y1="68" x2="232" y2="112" stroke="#e8a040" stroke-width="3" stroke-linecap="round"/><line x1="248" y1="79" x2="248" y2="101" stroke="#e8a040" stroke-width="7" stroke-linecap="round"/>
<text x="240" y="60" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" text-anchor="middle" fill="#f5f0e8">supply</text>
<rect x="212" y="180" width="56" height="20" fill="#0f0e0c" stroke="#e8a040" stroke-width="3"/>
<text x="240" y="168" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="middle" fill="rgba(245,240,232,0.68)">branch 1</text>
<rect x="212" y="280" width="56" height="20" fill="#0f0e0c" stroke="#e8a040" stroke-width="3"/>
<text x="240" y="268" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="middle" fill="rgba(245,240,232,0.68)">branch 2</text>
<circle cx="90" cy="190" r="5" fill="rgba(245,240,232,0.85)" stroke="rgba(245,240,232,0.85)" stroke-width="1"/>
<circle cx="390" cy="190" r="5" fill="rgba(245,240,232,0.85)" stroke="rgba(245,240,232,0.85)" stroke-width="1"/>
<line x1="408" y1="165" x2="408" y2="115" stroke="#4ecfaa" stroke-width="2.5" marker-end="url(#at)" stroke-linecap="round"/>
<line x1="130" y1="206" x2="180" y2="206" stroke="#4ecfaa" stroke-width="2.5" marker-end="url(#at)" stroke-linecap="round"/>
<line x1="130" y1="306" x2="180" y2="306" stroke="#4ecfaa" stroke-width="2.5" marker-end="url(#at)" stroke-linecap="round"/>
<text x="20" y="346" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#f5f0e8">Each branch has the full supply p.d.</text>
<text x="20" y="368" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#f5f0e8">across it.</text>
<text x="20" y="400" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#f5f0e8">The current splits between the branches,</text>
<text x="20" y="422" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#f5f0e8">then joins up again.</text>
</svg>
