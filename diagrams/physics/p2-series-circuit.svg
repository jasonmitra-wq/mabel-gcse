<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="100%" role="img" aria-label="Series circuit: a 12 V supply and two resistors in one loop; 2 A everywhere; 8 V and 4 V across the resistors add up to 12 V">
<defs><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="rgba(245,240,232,0.85)"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8a040"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4ecfaa"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8705a"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="rgba(245,240,232,0.68)"/></marker></defs>
<rect x="0" y="0" width="480" height="360" fill="#0f0e0c" stroke="none" stroke-width="3"/>
<text x="20" y="36" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#f5f0e8">Series: one loop</text>
<path d="M90 100 H390 V260 H90 Z" fill="none" stroke="rgba(245,240,232,0.85)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="231" y="96" width="18" height="8" fill="#0f0e0c" stroke="none" stroke-width="3"/><line x1="232" y1="78" x2="232" y2="122" stroke="#e8a040" stroke-width="3" stroke-linecap="round"/><line x1="248" y1="89" x2="248" y2="111" stroke="#e8a040" stroke-width="7" stroke-linecap="round"/>
<text x="240" y="66" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" text-anchor="middle" fill="#f5f0e8">12 V supply</text>
<rect x="142" y="250" width="56" height="20" fill="#0f0e0c" stroke="#e8a040" stroke-width="3"/>
<text x="170" y="304" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" text-anchor="middle" fill="#f5f0e8">8 V across</text>
<rect x="282" y="250" width="56" height="20" fill="#0f0e0c" stroke="#e8a040" stroke-width="3"/>
<text x="310" y="304" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" text-anchor="middle" fill="#f5f0e8">4 V across</text>
<line x1="72" y1="150" x2="72" y2="210" stroke="#4ecfaa" stroke-width="2.5" marker-end="url(#at)" stroke-linecap="round"/>
<text x="64" y="186" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" text-anchor="end" fill="#4ecfaa">2 A</text>
<line x1="408" y1="210" x2="408" y2="150" stroke="#4ecfaa" stroke-width="2.5" marker-end="url(#at)" stroke-linecap="round"/>
<text x="416" y="186" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#4ecfaa">2 A</text>
<text x="240" y="178" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="middle" fill="#f5f0e8">Same current everywhere.</text>
<text x="240" y="202" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="middle" fill="#f5f0e8">8 V + 4 V = 12 V</text>
</svg>
