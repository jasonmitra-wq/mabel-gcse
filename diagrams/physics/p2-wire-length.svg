<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" width="100%" role="img" aria-label="Circuit for measuring the resistance of a wire: a cell, a switch and an ammeter in series with a test wire laid along a metre ruler, a voltmeter in parallel across the length of wire between two clips, one clip moved to change the length">
<defs><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8a040"/></marker></defs>
<rect x="0" y="0" width="480" height="380" fill="#0f0e0c" stroke="none"/>
<text x="20" y="36" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#f5f0e8">Resistance of a wire</text>
<path d="M110 250 H80 V100 H222 M258 100 H400 V226 H330" fill="none" stroke="rgba(245,240,232,0.85)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="151" y="96" width="18" height="8" fill="#0f0e0c" stroke="none"/><line x1="152" y1="78" x2="152" y2="122" stroke="#e8a040" stroke-width="3" stroke-linecap="round"/><line x1="168" y1="89" x2="168" y2="111" stroke="#e8a040" stroke-width="7" stroke-linecap="round"/>
