<circle cx="320" cy="100" r="19" fill="#0f0e0c" stroke="#e8a040" stroke-width="3"/><text x="320" y="107" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#e8a040">A</text>
<text x="320" y="66" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" text-anchor="middle" fill="#f5f0e8">ammeter</text>
<line x1="110" y1="250" x2="370" y2="250" stroke="#4ecfaa" stroke-width="4" stroke-linecap="round"/>
<rect x="100" y="262" width="280" height="18" fill="none" stroke="rgba(245,240,232,0.55)" stroke-width="2"/>
<path d="M128 262 V270 M156 262 V270 M184 262 V270 M212 262 V270 M240 262 V274 M268 262 V270 M296 262 V270 M324 262 V270 M352 262 V270" stroke="rgba(245,240,232,0.55)" stroke-width="2"/>
<path d="M110 250 V200 H221 M259 200 H330 V250" fill="none" stroke="rgba(245,240,232,0.85)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="240" cy="200" r="19" fill="#0f0e0c" stroke="#e8a040" stroke-width="3"/><text x="240" y="207" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#e8a040">V</text>
<text x="240" y="166" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="middle" fill="#f5f0e8">voltmeter (in parallel)</text>
<circle cx="110" cy="250" r="7" fill="#e8a040"/><circle cx="330" cy="250" r="7" fill="#e8a040"/>
<circle cx="330" cy="226" r="4.5" fill="rgba(245,240,232,0.85)"/>
<line x1="222" y1="100" x2="256" y2="84" stroke="#e8a040" stroke-width="3" stroke-linecap="round"/><circle cx="222" cy="100" r="3.5" fill="#e8a040"/><circle cx="258" cy="100" r="3.5" fill="#e8a040"/>
<text x="240" y="66" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" text-anchor="middle" fill="#f5f0e8">switch</text>
<text x="220" y="240" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="middle" fill="#4ecfaa">test wire</text>
<text x="240" y="304" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="middle" fill="#f5f0e8">metre ruler</text>
