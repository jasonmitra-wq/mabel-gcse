<rect x="28" y="200" width="140" height="64" rx="12" fill="rgba(245,240,232,0.06)" stroke="rgba(245,240,232,0.35)"/><text x="98" y="240" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#f5f0e8" text-anchor="middle">Solid</text><rect x="240" y="200" width="140" height="64" rx="12" fill="rgba(245,240,232,0.06)" stroke="rgba(245,240,232,0.35)"/><text x="310" y="240" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#f5f0e8" text-anchor="middle">Liquid</text><rect x="452" y="200" width="140" height="64" rx="12" fill="rgba(245,240,232,0.06)" stroke="rgba(245,240,232,0.35)"/><text x="522" y="240" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#f5f0e8" text-anchor="middle">Gas</text><line x1="172" y1="218" x2="236" y2="218" stroke="#e8a040" stroke-width="3" marker-end="url(#aa)"/><line x1="236" y1="248" x2="172" y2="248" stroke="#4ecfaa" stroke-width="3" marker-end="url(#at)"/><line x1="384" y1="218" x2="448" y2="218" stroke="#e8a040" stroke-width="3" marker-end="url(#aa)"/><line x1="448" y1="248" x2="384" y2="248" stroke="#4ecfaa" stroke-width="3" marker-end="url(#at)"/><text x="204" y="196" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#e8a040" text-anchor="middle">Melting</text><text x="204" y="284" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#4ecfaa" text-anchor="middle">Freezing</text><text x="416" y="178" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#e8a040" text-anchor="middle">Boiling or</text><text x="416" y="197" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#e8a040" text-anchor="middle">evaporating</text><text x="416" y="284" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#4ecfaa" text-anchor="middle">Condensing</text><path d="M98 196 C 98 110, 522 110, 522 196" fill="none" stroke="#e8a040" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#aa)"/><text x="310" y="122" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#e8a040" text-anchor="middle">Sublimation (solid straight to gas)</text><line x1="28" y1="330" x2="58" y2="330" stroke="#e8a040" stroke-width="3"/><text x="68" y="336" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="rgba(245,240,232,0.85)">Energy in: forces between particles are overcome</text><line x1="28" y1="362" x2="58" y2="362" stroke="#4ecfaa" stroke-width="3"/><text x="68" y="368" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="rgba(245,240,232,0.85)">Energy out: forces pull particles back together</text><text x="28" y="402" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="rgba(245,240,232,0.6)">The temperature stays the same while the state is changing.</text></svg>