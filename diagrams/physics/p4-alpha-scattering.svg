<text x="268" y="196" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#e8a040">nucleus (+)</text>
<line x1="24" y1="354" x2="64" y2="354" stroke="#4ecfaa" stroke-width="3" marker-end="url(#at)" stroke-linecap="round"/><text x="76" y="360" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#f5f0e8">most pass straight through</text>
<line x1="24" y1="380" x2="64" y2="380" stroke="#e8a040" stroke-width="3" marker-end="url(#aa)" stroke-linecap="round"/><text x="76" y="386" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#f5f0e8">a few are deflected through large angles</text>
