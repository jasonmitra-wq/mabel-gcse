<line x1="30" y1="260" x2="450" y2="260" stroke="#4ecfaa" stroke-width="2.5" marker-end="url(#at)" stroke-linecap="round"/>
<line x1="30" y1="300" x2="450" y2="300" stroke="#4ecfaa" stroke-width="2.5" marker-end="url(#at)" stroke-linecap="round"/>
<path d="M30 165 L190 165 Q245 163 280 128 L370 62" fill="none" stroke="#e8a040" stroke-width="2.5" marker-end="url(#aa)" stroke-linejoin="round" stroke-linecap="round"/>
