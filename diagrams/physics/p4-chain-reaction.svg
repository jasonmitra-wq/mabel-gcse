<text x="344" y="106" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#f5f0e8">each neutron</text>
<text x="344" y="128" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#f5f0e8">can split</text>
<text x="344" y="150" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#f5f0e8">another</text>
<text x="344" y="172" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#f5f0e8">nucleus</text>
<text x="92" y="246" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="middle" fill="rgba(245,240,232,0.68)">1 fission</text>
<text x="222" y="346" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="middle" fill="rgba(245,240,232,0.68)">3 fissions</text>
<text x="20" y="384" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#f5f0e8">Uncontrolled: the number grows fast (a weapon).</text>
<text x="20" y="408" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#f5f0e8">Controlled: on average one neutron from each</text>
<text x="20" y="430" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#f5f0e8">fission causes one more fission (a reactor).</text>
