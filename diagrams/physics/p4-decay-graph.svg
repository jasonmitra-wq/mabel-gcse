<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" width="100%" role="img" aria-label="A decay graph: activity halves every 2 hours, from 800 Bq to 400 Bq to 200 Bq, so the half-life is 2 hours">
