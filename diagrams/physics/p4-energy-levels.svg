<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" width="100%" role="img" aria-label="Energy levels at set distances from the nucleus: absorbing radiation moves an electron out to a higher level, emitting radiation moves it in to a lower level">
<defs><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="rgba(245,240,232,0.85)"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8a040"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4ecfaa"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8705a"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="rgba(245,240,232,0.68)"/></marker></defs>
<rect x="0" y="0" width="480" height="440" fill="#0f0e0c" stroke="none" stroke-width="3"/>
<text x="20" y="36" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#f5f0e8">Energy levels</text>
<circle cx="240" cy="190" r="48" fill="none" stroke="rgba(245,240,232,0.68)" stroke-width="1.5" stroke-dasharray="5 6"/>
<circle cx="240" cy="190" r="92" fill="none" stroke="rgba(245,240,232,0.68)" stroke-width="1.5" stroke-dasharray="5 6"/>
<circle cx="240" cy="190" r="136" fill="none" stroke="rgba(245,240,232,0.68)" stroke-width="1.5" stroke-dasharray="5 6"/>
<circle cx="240" cy="190" r="10" fill="#e8a040" stroke="#e8a040" stroke-width="1"/>
<circle cx="279.3192981258716" cy="162.4683310551498" r="7" fill="#5b9cf0" stroke="#5b9cf0" stroke-width="1"/>
<circle cx="128.59532197669708" cy="268.0063953437422" r="7" fill="#5b9cf0" stroke="#5b9cf0" stroke-width="1"/>
<line x1="286.7" y1="157.3" x2="306.4" y2="143.5" stroke="#e8a040" stroke-width="3" marker-end="url(#aa)" stroke-linecap="round"/>
<line x1="136.0" y1="262.8" x2="155.6" y2="249.1" stroke="#4ecfaa" stroke-width="3" marker-end="url(#at)" stroke-linecap="round"/>
<text x="258" y="196" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#e8a040">nucleus</text>
<line x1="24" y1="354" x2="64" y2="354" stroke="#e8a040" stroke-width="3" marker-end="url(#aa)" stroke-linecap="round"/><text x="76" y="360" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#f5f0e8">absorbs radiation: moves up a level, further out</text>
<line x1="24" y1="382" x2="64" y2="382" stroke="#4ecfaa" stroke-width="3" marker-end="url(#at)" stroke-linecap="round"/><text x="76" y="388" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#f5f0e8">emits radiation: moves down a level, closer in</text>
<text x="20" y="424" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="rgba(245,240,232,0.68)">Further from the nucleus = higher energy level.</text>
</svg>
