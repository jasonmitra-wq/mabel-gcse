<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" width="100%" role="img" aria-label="Nuclear fission: a uranium-235 nucleus absorbs a neutron and splits into two smaller nuclei, giving out 2 or 3 neutrons, gamma rays and energy">
<defs><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="rgba(245,240,232,0.85)"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8a040"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4ecfaa"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8705a"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="rgba(245,240,232,0.68)"/></marker></defs>
<rect x="0" y="0" width="480" height="440" fill="#0f0e0c" stroke="none" stroke-width="3"/>
<text x="20" y="36" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#f5f0e8">Nuclear fission</text>
<circle cx="40" cy="200" r="7" fill="#9a948a" stroke="#9a948a" stroke-width="1"/>
<line x1="50" y1="200" x2="112" y2="200" stroke="#9a948a" stroke-width="3" marker-end="url(#aw)" stroke-linecap="round"/>
<text x="20" y="180" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="rgba(245,240,232,0.68)">neutron</text>
<circle cx="165" cy="200" r="46" fill="rgba(232,160,64,0.22)" stroke="#e8a040" stroke-width="3"/><text x="165" y="206" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#f5f0e8">U-235</text>
<text x="165" y="272" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="middle" fill="rgba(245,240,232,0.68)">large, unstable</text>
<text x="165" y="294" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="middle" fill="rgba(245,240,232,0.68)">nucleus</text>
<line x1="200" y1="168" x2="330" y2="112" stroke="rgba(245,240,232,0.85)" stroke-width="3" marker-end="url(#aw)" stroke-linecap="round"/>
<line x1="200" y1="232" x2="330" y2="288" stroke="rgba(245,240,232,0.85)" stroke-width="3" marker-end="url(#aw)" stroke-linecap="round"/>
<circle cx="365" cy="100" r="30" fill="rgba(232,160,64,0.22)" stroke="#e8a040" stroke-width="3"/>
<circle cx="365" cy="300" r="30" fill="rgba(232,160,64,0.22)" stroke="#e8a040" stroke-width="3"/>
<text x="365" y="56" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="middle" fill="#f5f0e8">smaller nucleus</text>
<text x="365" y="354" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="middle" fill="#f5f0e8">smaller nucleus</text>
<line x1="214" y1="192" x2="300" y2="174" stroke="#9a948a" stroke-width="2.5" marker-end="url(#aw)" stroke-linecap="round"/>
<circle cx="310" cy="172" r="7" fill="#9a948a" stroke="#9a948a" stroke-width="1"/>
<line x1="214" y1="200" x2="306" y2="200" stroke="#9a948a" stroke-width="2.5" marker-end="url(#aw)" stroke-linecap="round"/>
<circle cx="316" cy="200" r="7" fill="#9a948a" stroke="#9a948a" stroke-width="1"/>
<line x1="214" y1="208" x2="300" y2="226" stroke="#9a948a" stroke-width="2.5" marker-end="url(#aw)" stroke-linecap="round"/>
<circle cx="310" cy="228" r="7" fill="#9a948a" stroke="#9a948a" stroke-width="1"/>
<text x="330" y="206" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#f5f0e8">2 or 3 neutrons</text>
<text x="20" y="396" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#f5f0e8">Also given out: gamma rays and energy.</text>
<text x="20" y="420" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="rgba(245,240,232,0.68)">The two smaller nuclei are roughly equal in size.</text>
