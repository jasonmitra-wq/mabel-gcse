<circle cx="70" cy="230" r="22" fill="rgba(232,160,64,0.22)" stroke="#e8a040" stroke-width="3"/>
<text x="70" y="72" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="middle" fill="#f5f0e8">light nucleus</text>
<text x="70" y="276" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="middle" fill="#f5f0e8">light nucleus</text>
<line x1="94" y1="122" x2="200" y2="162" stroke="rgba(245,240,232,0.85)" stroke-width="3" marker-end="url(#aw)" stroke-linecap="round"/>
