<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" width="100%" role="img" aria-label="Alpha is stopped by paper, beta by a few millimetres of aluminium, and gamma is only reduced by thick lead">
<defs><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="rgba(245,240,232,0.85)"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8a040"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4ecfaa"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8705a"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="rgba(245,240,232,0.68)"/></marker></defs>
<rect x="0" y="0" width="480" height="440" fill="#0f0e0c" stroke="none" stroke-width="3"/>
<text x="20" y="36" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#f5f0e8">What stops each radiation</text>
<rect x="24" y="100" width="40" height="240" rx="6" fill="rgba(245,240,232,0.05)" stroke="rgba(245,240,232,0.68)" stroke-width="2"/>
<text x="44" y="362" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="middle" fill="rgba(245,240,232,0.68)">source</text>
<rect x="167" y="92" width="6" height="256" fill="#f5f0e8" stroke="none" stroke-width="3"/>
<rect x="282" y="92" width="16" height="256" fill="#b8b8c0" stroke="none" stroke-width="3"/>
<rect x="382" y="92" width="36" height="256" fill="#6a6e78" stroke="none" stroke-width="3"/>
<text x="170" y="70" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="middle" fill="#f5f0e8">paper</text>
<text x="290" y="62" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="middle" fill="#f5f0e8">aluminium</text>
<text x="290" y="84" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="middle" fill="rgba(245,240,232,0.68)">(a few mm)</text>
<text x="408" y="62" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="middle" fill="#f5f0e8">lead</text>
<text x="408" y="84" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" text-anchor="middle" fill="rgba(245,240,232,0.68)">(thick)</text>
<line x1="70" y1="130" x2="164" y2="130" stroke="#e8705a" stroke-width="4" marker-end="url(#ar)" stroke-linecap="round"/>
<text x="84" y="118" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#e8705a">alpha (α)</text>
<line x1="70" y1="220" x2="279" y2="220" stroke="#e8a040" stroke-width="4" marker-end="url(#aa)" stroke-linecap="round"/>
<text x="84" y="208" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#e8a040">beta (β)</text>
<line x1="70" y1="310" x2="380" y2="310" stroke="#4ecfaa" stroke-width="4" stroke-linecap="round"/>
<line x1="420" y1="310" x2="466" y2="310" stroke="#4ecfaa" stroke-width="2" marker-end="url(#at)" stroke-dasharray="6 6" stroke-linecap="round"/>
<text x="84" y="298" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#4ecfaa">gamma (γ)</text>
<text x="20" y="396" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#f5f0e8">Gamma is only reduced by thick lead,</text>
<text x="20" y="420" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#f5f0e8">not stopped completely.</text>
</svg>
